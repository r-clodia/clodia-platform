# Egress proxy for the agent container (clodia-platform#104, phase 1).
#
# The agents' network is `internal`, so this proxy is the ONLY route out. That
# is the point: a binary that ignores HTTPS_PROXY and opens its own socket does
# not get filtered — it gets no route at all. The proxy adds host granularity on
# top of "no route", it is not the thing that stops a determined process.
#
# HTTPS goes through CONNECT, so what we see and filter is host:port, never the
# path or the body. No TLS interception, no CA to distribute: consequence worth
# stating, a whitelisted host is whitelisted for ALL of its paths.

User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
Timeout 600

# Only CONNECT to 443 (and 80 for plain HTTP that we do not want but some
# installers still use). Everything else is refused.
ConnectPort 443
ConnectPort 80

# Default-deny: the filter file is an allow-list of host patterns.
Filter "/etc/tinyproxy/allowlist"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off
# Filter on the host, not the URL: with CONNECT there is no URL to filter.
FilterURLs Off

# Destination logging is a feature here, not a side effect: it is the only
# record of where the agents actually go, and it feeds the per-seed allow-lists
# of #104 §7 until the verb telemetry of #110 exists.
LogLevel Connect
LogFile "/var/log/tinyproxy/tinyproxy.log"

MaxClients 60
DisableViaHeader Yes
