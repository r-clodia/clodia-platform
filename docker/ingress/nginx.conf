# Ingress for the agent API (clodia-platform#104 phase C).
#
# WHY THIS EXISTS
# ---------------
# Phase C puts the agent container on an `internal` docker network, which is what
# actually removes its route to the outside. But an internal network also disables
# host port publishing — measured — so the API would stop being reachable from the
# browser. This proxy is the one component that sits on both networks and forwards
# inbound requests, so the agent container needs no published port of its own.
#
# It replaces the host-firewall approach of earlier drafts, which cannot work on
# this deployment: docker runs ROOTLESS here, so container traffic leaves through
# rootlesskit inside a user namespace and never traverses the host's DOCKER-USER
# chain. `internal: true` is enforced by docker itself and, unlike an iptables
# rule, is not something a process inside the container could ever undo.

server {
    listen 7842;
    server_name _;

    # Streaming endpoints (SSE) must not be buffered or the UI freezes waiting
    # for events that nginx is holding.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    client_max_body_size 100m;

    # Il DNS interno di docker, e gli upstream risolti a RUNTIME.
    #
    # Senza, nginx risolve i nomi all'AVVIO: se il gateway non è ancora su,
    # l'ingress non parte affatto — e con lui cade anche la webui, per un
    # servizio che non c'entra. Peggio, l'indirizzo risolto una volta resta
    # in cache per sempre: al primo restart del gateway l'ingress continuerebbe
    # a parlare a un IP che non esiste più, e il sintomo (502 sporadici) non
    # somiglia per niente alla causa.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The gateway's MCP endpoint, and ONLY that.
    #
    # A person (or a proxy) connects their own MCP client to a single room with
    # a signed token. The config we hand out has always pointed at `<origin>/mcp`
    # — and that path answered 404, measured on terra 14 Aug 2026, because
    # everything here went to the agent-server, which has no such route. The
    # credential was valid and the door did not exist.
    #
    # Listed one path at a time on purpose. The gateway also serves
    # `/internal/*`, authorised by a shared secret meant for the container
    # network: a prefix or a wildcard here would publish the whole control plane
    # to the internet. What is exposed is exactly what an outside client needs —
    # the MCP endpoint, and the endpoint where a proxy exchanges a signed
    # assertion for a short-lived token.
    # Rewritten to the trailing slash HERE, not left to a redirect. The mount
    # answers on `/mcp/` and 307s `/mcp` — measured — and a redirect on a POST
    # is the classic way to lose a body or an Authorization header on the way,
    # producing an auth error for what is a routing detail.
    location = /mcp {
        set $gateway clodia-tools:7849;
        proxy_pass http://$gateway/mcp/;
        include /etc/nginx/conf.d/upstream-headers.inc;
    }
    location /mcp/ {
        set $gateway clodia-tools:7849;
        proxy_pass http://$gateway/mcp/;
        include /etc/nginx/conf.d/upstream-headers.inc;
    }
    location = /proxy/token {
        set $gateway clodia-tools:7849;
        proxy_pass http://$gateway/proxy/token;
        include /etc/nginx/conf.d/upstream-headers.inc;
    }

    location / {
        proxy_pass http://agent-server:7842;
        include /etc/nginx/conf.d/upstream-headers.inc;
    }
}
