# Ingress for the agent API (clodia-platform#104 phase C).
#
# WHY THIS EXISTS
# ---------------
# Phase C puts the agent container on an `internal` docker network, which is what
# actually removes its route to the outside. But an internal network also disables
# host port publishing — measured — so the API would stop being reachable from the
# browser. This proxy is the one component that sits on both networks and forwards
# inbound requests, so the agent container needs no published port of its own.
#
# It replaces the host-firewall approach of earlier drafts, which cannot work on
# this deployment: docker runs ROOTLESS here, so container traffic leaves through
# rootlesskit inside a user namespace and never traverses the host's DOCKER-USER
# chain. `internal: true` is enforced by docker itself and, unlike an iptables
# rule, is not something a process inside the container could ever undo.

server {
    listen 7842;
    server_name _;

    # Streaming endpoints (SSE) must not be buffered or the UI freezes waiting
    # for events that nginx is holding.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    client_max_body_size 100m;

    location / {
        proxy_pass http://agent-server:7842;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / SSE upgrade path
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
    }
}
